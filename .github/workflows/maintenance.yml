name: Manutencao Automatica Segura

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK || secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          # ---------------------------------------------------------------------
          # POR QUE `ref: develop` (medido em 03/10/2026 - leia antes de "simplificar")
          # ---------------------------------------------------------------------
          # O workflow e AGENDADO. Workflow agendado executa o YAML que esta na
          # branch DEFAULT do repositorio, e a default deste repositorio e `main`.
          #
          # JA HOUVE DUAS CORRECOES NESSE MESMO PONTO, E AS DUAS FICARAM PARCIAS:
          #
          # 1. `ref: develop` foi acrescentado (commit e857528) porque o cron
          #    executava codigo de 01/10 e falhava com
          #        ModuleNotFoundError: No module named 'fastapi'
          #    `requirements-ci.txt` na `main` NAO tem `fastapi`; na `develop` tem.
          #    O sintoma e identico ao de um defeito de codigo e nao e: e codigo velho.
          #
          # 2. MAS o `ref: develop` so funciona se ESTE YAML chegar na `main`. Em
          #    03/10/2026 a `main` estava 53 commits atras, entao o GitHub executava
          #    a VERSAO ANTIGA deste arquivo - sem o `ref` - e o cron reprovou de novo
          #    com o MESMO ModuleNotFoundError, abrindo a issue #25.
          #
          # MEDIDO (03/10/2026):
          #   gh repo view --json defaultBranchRef            ->  main
          #   `ref:` em origin/main/.../maintenance.yml       ->  0 ocorrencias
          #   `ref:` em origin/develop/.../maintenance.yml    ->  1 ocorrencia
          #   commits de develop nao mergeados em main       ->  53
          #
          # OU SEJA: enquanto este arquivo nao estiver na branch default, o `ref`
          # abaixo NAO EXISTE para o agendamento. Nao e bug do GitHub, e alei.
          #
          # CORRECAO DE VERDADE: mergear `develop` na branch default. Ate la este
          # cron falha todo dia as 10:17 UTC por rodar codigo velho. O passo
          # "Diagnosticar branch" abaixo existe para que a proxima falha diga a
          # CAUSA, em vez de custar outra investigacao do zero.
          ref: develop
      - name: Diagnosticar branch (a causa real quando o cron reprova)
        run: |
          # Se o `ref: develop` acima nao surtiu efeito, a causa e quase sempre a
          # mesma: o YAML veio da branch default e nao da develop. Dizer isso no
          # log economiza a sessao inteira de investigacao seguinte.
          ATUAL=$(git rev-parse --abbrev-ref HEAD)
          echo "branch em execucao: $ATUAL @ $(git rev-parse --short HEAD)"
          if [ "$ATUAL" != "develop" ]; then
            echo ""
            echo "::error::O cron rodou '$ATUAL', nao 'develop'."
            echo "::error::Workflow agendado usa o YAML da branch DEFAULT do repositorio."
            echo "::error::Se 'ref: develop' nao surtiu efeito, este YAML esta VELHO na default."
            echo "::error::Correcao: mergear 'develop' na branch default. Nao e bug de codigo."
            DEFAULT=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo main)
            echo "::error::Branch default: $DEFAULT"
            git fetch origin "$DEFAULT" --depth=50 2>/dev/null || true
            echo "::error::Commits da develop que faltam na default:"
            git log --oneline "origin/$DEFAULT..HEAD" 2>/dev/null | head -20 || true
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias Python
        run: |
          pip install -r requirements-ci.txt
      - name: Validar Python
        run: |
          python -m compileall -q Python app
          xvfb-run -a python -m pytest -q tests
      - name: Validar backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm audit --audit-level=high
      - name: Verificar API Vercel
        run: curl --fail --silent --show-error --max-time 30 https://xau-ai-pro-api-apolopanda500.vercel.app/api/health
      - name: Abrir issue de manutencao quando falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Falha automática de manutenção"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="A manutenção automática falhou no run $GITHUB_RUN_NUMBER. Analise os logs: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY" --label bug; fi
      - name: Notificar Slack em falha
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook-type: incoming-webhook
          payload: |
            {"text":":warning: Manutenção XAU AI PRO falhou: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
