# CodeQL Advanced Configuration
# https://docs.github.com/en/code-security/code-scanning/customizing-code-scanning
#
# This config file customizes the CodeQL code scanning workflow
# (.github/workflows/codeql.yml). It enables security-extended and
# security-and-quality query suites to catch additional vulnerabilities.

name: "CodeQL Advanced Configuration"

# Languages to analyze (must match the matrix in the workflow)
queries:
  # Enhanced security queries (includes security-extended)
  - uses: security-extended
  - uses: security-and-quality

# Paths to exclude from analysis (reduce noise)
paths-ignore:
  - "node_modules/"
  - "backend/node_modules/"
  - "frontend/node_modules/"
  - ".venv/"
  - "venv/"
  - "env/"
  - "__pycache__/"
  - "*.pyc"
  - ".git/"
  - "dist/"
  - "build/"
  - "backend/.output/"
  - "backend/.vercel/"
  - "backend/.nitro/"
  - "MQL5/Experts/*/*.ex5"
  - "MQL5/Scripts/*.ex4"
  - "MQL5/Scripts/*.ex5"
  - "MQL5/Files/Data/dataset.csv"
  - "MQL5/Files/Data/prediction_*.json"
  - "MQL5/Files/Data/forward_test_events.csv"
  - "MQL5/Files/Data/system_status.json"
  - "Python/models/"
  - "Models/"
  - "ai/"
  - "Reports/"
  - "Temp/"
  - "Backup_v120/"
  - "**/*.pkl"
  - "**/*.pkg"
  - "**/*.pyz"
  - "**/*.pyd"
  - "**/models_backup_*/"
  - "**/trading.db"
  - "*.log"

# Additional CodeQL packs to use (if needed)
packs:
  # Python security-focused packs
  - python-security-and-quality:0.0.6
  # JavaScript/TypeScript security-focused packs
  - javascript-security-and-quality:0.0.9
  # Actions security-focused packs
  - actions-security-and-quality:0.0.3

# Query filters - prioritize high and critical severity
query-filters:
  - exclude:
      - severity: "low"
  - include:
      - severity: "error"
      - severity: "warning"
      - severity: "note"