name: Manutencao Automatica Segura

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # POR QUE SEM `ref: develop` (medido em 05/11/2026 - leia antes de repor)
      # -----------------------------------------------------------------------
      # O cron falhou todos os dias de 28/10 a 04/11 (issue #43) e o motivo nao
      # era codigo: este workflow fazia checkout da branch `develop` enquanto o
      # default do repositorio e `main`.
      #
      # MEDIDO no run 41954293907 (dispatch manual, log completo):
      #   5 failed, 1473 passed, 86 skipped, 2 errors
      #   FAILED tests/test_vip_progress.py   (5 testes, `assert 0.0 == 100.0`)
      #   ERROR  tests/test_bundle_gateway_artefato.py (2 erros)
      # E MEDIDO no diff `main..develop`:
      #   `main` tem o commit 8fdc5b0 "fix(ci): testes com data relativa,
      #   fixture de classe na ordem certa" - `develop` NAO tem.
      # Ou seja: o job reprovava por testar uma branch 9 commits atras das
      # correcoes que ja estavam na default. Nao era defeito de codigo.
      #
      # Enquanto o YAML ficar na default, o agendamento executa a versao da
      # default; um `ref:` apontando para outra branch faz o health check medir
      # algo que nao e o que se publica. O checkout abaixo, sem `ref`, mede
      # exactamente o que embarca.
      #
      # Se um dia `develop` voltar a ser a branch de integracao, a correcao
      # certa NAO e recolocar `ref:` aqui: e mergear a default na `develop`
      # para ela nao ficar atras das correcoes. O passo seguinte publica a
      # branch e o commit testados, para a proxima falha nao custar uma sessao.
      - uses: actions/checkout@v5

      - name: Registar o codigo testado (branch + commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "branch em execucao: ${{ github.ref_name }}"
          echo "commit: $(git rev-parse --short HEAD)"
          DEFAULT=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo main)
          echo "branch default do repositorio: $DEFAULT"
          if [ "${{ github.ref_name }}" != "$DEFAULT" ]; then
            echo "::warning::Este run testou '${{ github.ref_name }}', nao a default '$DEFAULT'."
            echo "::warning::Execucao manual numa branch nao-default e permitida, mas o resultado nao descreve o que embarca."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias Python
        run: |
          pip install -r requirements-ci.txt
      - name: Validar Python
        run: |
          python -m compileall -q Python app
          xvfb-run -a python -m pytest -q tests
      - name: Validar backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm audit --audit-level=high
      # O passo "Verificar API Vercel" e a notificacao no Slack foram REMOVIDOS
      # em 04/10/2026: o projeto e 100% local e nao tem API hospedada para
      # checar. O sinal de problema e a issue aberta abaixo.
      - name: Abrir issue de manutencao quando falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Falha automática de manutenção"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="A manutenção automática falhou no run $GITHUB_RUN_NUMBER (branch \`${{ github.ref_name }}\`, commit \`$(git rev-parse --short HEAD)\`). Analise os logs: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY" --label bug; fi
      # -----------------------------------------------------------------------
      # Fechar no sucesso (medido em 05/11/2026)
      # -----------------------------------------------------------------------
      # Ate aqui o workflow so sabia ABRIR issue: quando o problema era
      # resolvido, a issue ficava aberta para sempre e o alerta virava ruido.
      # A #43 acumulou 8 comentarios de falha e continuou aberta mesmo depois
      # de o motivo ter sido corrigido. Agora o ciclo fecha sozinho, e o
      # comentario diz qual run o fechou - fechar sem rastro seria o outro
      # extremo.
      - name: Fechar a issue quando o ciclo passar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Falha automática de manutenção"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            echo "Nenhuma issue de manutencao aberta - nada a fechar."
            exit 0
          fi
          BODY="Ciclo de manutenção **verde** no run $GITHUB_RUN_NUMBER (branch \`${{ github.ref_name }}\`, commit \`$(git rev-parse --short HEAD)\`). Logs: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID - fechada automaticamente pelo workflow."
          gh issue comment "$EXISTING" --body "$BODY"
          gh issue close "$EXISTING" --reason completed
