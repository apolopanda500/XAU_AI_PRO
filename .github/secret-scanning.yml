# Secret scanning custom patterns for XAU_AI_PRO
# https://docs.github.com/en/code-security/secret-scanning/working-with-secret-scanning-and-codeql/writing-custom-patterns
patterns:
  # ============================================
  # Sentry DSN (XAU_AI_PRO specific)
  # ============================================
  - title: "Sentry DSN exposta"
    description: "Detecta DSNs do Sentry expostas em codigo/fonte."
    regex: "https://[a-f0-9]+@[0-9]+\\.ingest\\.de\\.sentry\\.io/[0-9]+"
    severity: "critical"
    validations:
      - "Sentry DSN deve estar apenas em .env, nunca em codigo fonte"
    tags: ["credentials", "monitoring", "sentry"]

  # ============================================
  # Vercel tokens/org/project IDs
  # ============================================
  - title: "Vercel Org ID exposto"
    description: "Detecta IDs de organizacao Vercel hardcoded."
    regex: "(vercel_org_id\\s*=\\s*[\"'][^\"']+[\"']|team_[a-zA-Z0-9]+)"
    severity: "high"
    tags: ["deployment", "vercel"]

  - title: "Vercel Project ID exposto"
    description: "Detecta IDs de projeto Vercel hardcoded."
    regex: "(vercel_project_id\\s*=\\s*[\"'][^\"']+[\"']|prj_[a-zA-Z0-9]+)"
    severity: "high"
    tags: ["deployment", "vercel"]

  # ============================================
  # MetaTrader 5 credentials
  # ============================================
  - title: "MT5 login/server exposto"
    description: "Detecta credenciais de conta MetaTrader 5 hardcoded."
    regex: "(mt5_login|mt5_password|mt5_server|account_number)\\s*[:=]\\s*[\"']?\\d{5,7}"
    severity: "critical"
    tags: ["trading", "mt5"]

  # ============================================
  # API Keys genericas
  # ============================================
  - title: "BRAVE_API_KEY exposta"
    description: "Detecta chaves da API do Brave Search hardcoded."
    regex: "brave_api_key\\s*[:=]\\s*[\"'][A-Za-z0-9_-]{32,}"
    severity: "critical"
    tags: ["api-key", "brave"]

  - title: "Alpha Vantage API key exposta"
    description: "Detecta chaves da API Alpha Vantage hardcoded."
    regex: "(alpha_vantage_key|ALPHA_VANTAGE_API_KEY)\\s*[:=]\\s*[\"'][A-Z0-9]{16}"
    severity: "high"
    tags: ["api-key", "finance"]

  - title: "Figma token exposto"
    description: "Detecta tokens de acesso Figma hardcoded."
    regex: "figma_token\\s*[:=]\\s*[\"'][A-Za-z0-9_-]{32,}"
    severity: "critical"
    tags: ["api-key", "figma"]

  # ============================================
  # Slack webhook URLs
  # ============================================
  - title: "Slack webhook URL real exposta"
    description: "Detecta URLs de webhook do Slack que nao sao placeholders."
    regex: "https://hooks\\.slack\\.com/services/[A-Z0-9]+/[A-Z0-9]+/[A-Za-z0-9]+"
    exclude-rule: "https://hooks\\.slack\\.com/services/T00000000/B00000000/.*"
    severity: "critical"
    tags: ["credentials", "slack"]

  # ============================================
  # GitHub tokens
  # ============================================
  - title: "GitHub PAT exposta"
    description: "Detecta Personal Access Tokens do GitHub hardcoded."
    regex: "gh[pousr]_[A-Za-z0-9]{36,}"
    severity: "critical"
    tags: ["api-key", "github"]

  # ============================================
  # OpenAI API keys
  # ============================================
  - title: "OpenAI API key exposta"
    description: "Detecta chaves da API OpenAI hardcoded."
    regex: "sk-[?:-[a-zA-Z]{20}|[a-zA-Z0-9]{20,}}"
    exclude-rule: "sk-test-[a-zA-Z0-9]+"
    exclude-rule: "sk-xau-ai-pro-local"
    severity: "critical"
    tags: ["api-key", "openai"]

  # ============================================
  # Docker Hub credentials
  # ============================================
  - title: "Docker Hub PAT exposta"
    description: "Detecta tokens do Docker Hub hardcoded."
    regex: "(DOCKER_USER|DOCKER_PAT)\\s*[:=]\\s*[\"'][^\"']{6,}"
    severity: "critical"
    tags: ["credentials", "docker"]

  # ============================================
  # Default admin password
  # ============================================
  - title: "Credencial default admin/admin"
    description: "Detecta uso de credencial padrao admin/admin no codigo."
    regex: "create_user\\([\"']admin[\"']\\s*,\\s*[\"']admin[\"']\\)"
    severity: "high"
    tags: ["credentials", "default-password"]

  # ============================================
  # VERCEL_TOKEN (real tokens, not placeholders)
  # ============================================
  - title: "Vercel token exposta"
    description: "Detecta tokens de autenticacao Vercel hardcoded."
    regex: "(vercel_token|VERCEL_TOKEN)\\s*[:=]\\s*[\"'][A-Za-z0-9._-]{20,}"
    severity: "critical"
    tags: ["api-key", "vercel"]