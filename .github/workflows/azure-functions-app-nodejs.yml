# This workflow will build a Node.js project and deploy it to an Azure Functions App on Windows or Linux when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure Functions app.
# For instructions see:
#   - https://learn.microsoft.com/en-us/azure/azure-functions/create-first-function-vs-code-node
#   - https://learn.microsoft.com/en-us/azure/azure-functions/create-first-function-vs-code-typescript
#
# To configure this workflow:
# 1. Set up the following secrets in your repository:
#   - AZURE_FUNCTIONAPP_PUBLISH_PROFILE
# 2. Change env variables for your configuration.
#
# For more information on:
#   - GitHub Actions for Azure: https://github.com/Azure/Actions
#   - Azure Functions Action: https://github.com/Azure/functions-action
#   - Publish Profile: https://github.com/Azure/functions-action#using-publish-profile-as-deployment-credential-recommended
#   - Azure Service Principal for RBAC: https://github.com/Azure/functions-action#using-azure-service-principal-for-rbac-as-deployment-credential
#
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples/tree/master/FunctionApp

name: Deploy Node.js project to Azure Function App

on:
  push:
    branches: ["main"]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-functions-app-nodejs.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-functions-app-nodejs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Enquanto não houver um Azure Function App real configurado, este
  # workflow fica desativado por padrão mas continua válido/sintaticamente ok.
  # Para ativar: crie o Function App no Azure, configure o secret
  # AZURE_FUNCTIONAPP_PUBLISH_PROFILE e defina AZURE_FUNCTIONS_ENABLED=true
  # nos secrets/variables do repositório.
  AZURE_FUNCTIONS_ENABLED: 'false'
  AZURE_FUNCTIONAPP_NAME: 'your-app-name'   # set this to your function app name on Azure
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend' # set this to the path to your function app project
  NODE_VERSION: '20.x'                      # set this to the node version to use (e.g. '8.x', '10.x', '12.x')

jobs:
  build-and-deploy:
    runs-on: windows-latest # For Linux, use ubuntu-latest
    environment: dev
    # Pula de forma limpa quando o Azure ainda não foi configurado.
    # Observação: contexto `secrets` não é permitido em `if` de job,
    # por isso a checagem do publish profile acontece no primeiro step.
    if: vars.AZURE_FUNCTIONS_ENABLED == 'true'
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Check Azure Functions enabled'
      shell: pwsh
      env:
        AZURE_FUNCTIONAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:AZURE_FUNCTIONAPP_PUBLISH_PROFILE)) {
          echo "Azure Functions desativado: AZURE_FUNCTIONAPP_PUBLISH_PROFILE ausente. Pulando deploy."
          "SKIP_AZURE=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        }

    # If you want to use Azure RBAC instead of Publish Profile, then uncomment the task below
    # - name: 'Login via Azure CLI'
    #   uses: azure/login@v1
    #   with:
    #     creds: ${{ secrets.AZURE_RBAC_CREDENTIALS }} # set up AZURE_RBAC_CREDENTIALS secrets in your repository

    - name: Setup Node ${{ env.NODE_VERSION }} Environment
      if: env.SKIP_AZURE != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Resolve Project Dependencies Using Npm'
      if: env.SKIP_AZURE != 'true'
      shell: pwsh # For Linux, use bash
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        npm install
        npm run build --if-present
        npm run test --if-present
        popd

    - name: 'Validate Azure configuration'
      if: env.SKIP_AZURE != 'true'
      shell: pwsh
      run: |
        if ("${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}" -eq "") {
          Write-Error "AZURE_FUNCTIONAPP_PUBLISH_PROFILE não configurado. Configure o secret ou mantenha AZURE_FUNCTIONS_ENABLED=false."
          exit 1
        }
        if ("${{ env.AZURE_FUNCTIONAPP_NAME }}" -eq "your-app-name") {
          Write-Error "AZURE_FUNCTIONAPP_NAME ainda está como 'your-app-name'. Configure o nome real do Function App."
          exit 1
        }

    - name: 'Run Azure Functions Action'
      if: env.SKIP_AZURE != 'true'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }} # Remove publish-profile to use Azure RBAC
