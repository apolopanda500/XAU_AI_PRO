# Gitleaks configuration for XAU_AI_PRO
# https://github.com/gitleaks/gitleaks
#
# Detecta segredos expostos no codigo fonte do projeto XAU_AI_PRO.
# Formato gitleaks v8.25+ (o `[allowlist]`/`allowlist = [...]` antigo foi
# substituido por `[[allowlists]]` em v8.25; o array antigo era ignorado e
# por isso o job "Security Checks" falhava em 09/11/2026 com 18 achados
# historicos ja revistos).

title = "XAU_AI_PRO Gitleaks Configuration"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# 1. Historico revisto (09/11/2026) - nenhum destes achados e' segredo vivo:
#    Docs com exemplos, testes vendored do numpy, ficheiros de teste/legado
#    ja removidos do HEAD, e um admin/admin que o codigo actual ja substituiu
#    por senha aleatoria (app/config_manager.py:212-223).
#    O allowlist por commit e' preciso: nao cega commits novos nem o HEAD.
#    Se algum destes valores for real, TEM de ser rodado/revogado no
#    fornecedor - o allowlist apenas silencia o scanner.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Historico revisto: falsos positivos e credenciais ja remediadas/legado removido"
commits = [
  "159c386edce54a4f8b4b36c7ae844b7be6b12241",
  "3f04d742cae306becf16324a8b43309d08f9dbbd",
  "568228f863b2181aed17c20d631a7776fcb461da",
  "d16dfd6f59d4ac541f0f7c72ecaae407ebe7e8c4",
  "c168d45d1156ca01010830e0d7b6cf062f5bcabd",
  "031918b85d7f95eef82dbb258472fcc13db052cb",
  "6116471612b4aac8765bdee88307dee7d1c7e7e9",
  "e58b778f037c2587a7dde712fb1d82d673e759c8",
  "c33fbc28689e5b3507cf4cfdd9b277c111c947c0",
  "e37de5131e944b2ac67eb05dc669256d4aeb3765",
]

# ---------------------------------------------------------------------------
# 2. Placeholders e referencias a secrets do GitHub Actions. Compara a LINHA
#    inteira: `${{ secrets.X }}` e fallbacks entre aspas nunca sao segredos.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Placeholders locais e referencias a secrets do GitHub Actions"
regexTarget = "line"
regexes = [
  '''your_broker_api_key_here''',
  '''your_broker_api_secret_here''',
  '''T00000000/B00000000/XXXXXXXXX''',
  '''sk-test-''',
  '''sk-xau-ai-pro-local''',
  '''SENTRY_DSN=''',
  '''SLACK_WEBHOOK_URL=''',
  '''OPENAI_API_KEY=''',
  '''CLINE_API_KEY=''',
  '''BROKER_API_KEY=''',
  '''BROKER_API_SECRET=''',
  '''GITHUB_TOKEN=''',
  '''VERCEL_TOKEN=''',
  '''\$\{\{\s*secrets\.[A-Za-z0-9_]+''',
]

[[rules]]
id = "custom-sentry-dsn"
description = "Sentry DSN real exposta"
regex = "https://[a-f0-9]+@[0-9]+[.]ingest[.]de[.]sentry[.]io/[0-9]+"
severity = "CRITICAL"
path = ".env.example"

[[rules]]
id = "custom-github-pat"
description = "GitHub Personal Access Token"
regex = "gh[pousr]_[A-Za-z0-9]{36,}"
severity = "CRITICAL"

[[rules]]
id = "custom-slack-webhook"
description = "Slack webhook URL real"
regex = "https://hooks[.]slack[.]com/services/[A-Z0-9]+/[A-Z0-9]+/[A-Za-z0-9]+"
severity = "CRITICAL"

[[rules]]
id = "custom-admin-creds"
description = "Credencial default admin/admin"
regex = "create_user[[:punct:]]*(admin|password)[[:punct:]]*[,][[:space:]]*[[:punct:]]*(admin|password)"
severity = "HIGH"

[[rules]]
id = "custom-hardcoded-key"
description = "API key hardcoded em codigo fonte"
regex = "(api_key|api_secret|secret_key)[[:space:]]*[:=][[:space:]]*[[:punct:]][a-zA-Z0-9._-]{16,}"
severity = "HIGH"

[[rules]]
id = "custom-docker-pat"
description = "Docker Hub PAT"
regex = "(DOCKER_USER|DOCKER_PAT)[[:space:]]*[:=][[:space:]]*[[:punct:]][^[:space:]]{6,}"
severity = "CRITICAL"

[[rules]]
id = "custom-vercel-token"
description = "Vercel token exposta"
regex = "vercel_token[[:space:]]*[:=][[:space:]]*[[:punct:]][A-Za-z0-9._-]{20,}"
severity = "CRITICAL"
