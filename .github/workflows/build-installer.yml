name: Build Installer

on:
  # Build automatico em tags v* (release) ou manual pela aba Actions
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  segredos:
    # Este workflow empacota o instalador que chega na maquina do usuario.
    # Sem varredura de segredo aqui, uma credencial commitada por engano entraria
    # no binario e na release sem ninguem ver. Roda antes de qualquer build.
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo (historico)
        uses: actions/checkout@v4
        with:
          # O gitleaks so ve o que esta no historico. Sem `fetch-depth: 0` a
          # busca fica restrita ao ultimo commit e passa por cima de um
          # segredo que entrou e saiu antes.
          fetch-depth: 0
      - name: Varredura de segredos (historico completo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Impede o job de publicar o relatorio em Run Analysis mesmo
          # quando o repositorio e privado.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  build:
    name: EXE + Setup (Windows)
    needs: segredos
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de build
        run: pip install -r requirements-build.txt -r requirements-dev.txt

      - name: Testes automatizados
        run: python -m pytest -q tests

      - name: Smoke test - versao do launcher
        run: python Python\launcher.py versao

      - name: Build do EXE (PyInstaller)
        run: python -m PyInstaller --noconfirm launcher.spec

      - name: Smoke test do EXE
        run: .\dist\XAU_AI_PRO\XAU_AI_PRO.exe versao

      - name: Instalar Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador (ISCC)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyRoot="%CD%" installer\installer.iss'

      - name: Verificar e registrar hashes dos artefatos
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (!(Test-Path "dist/XAU_AI_PRO_Setup_$version.exe")) { throw 'Instalador da versao nao encontrado' }
          $artifacts = @(
            'dist/XAU_AI_PRO/XAU_AI_PRO.exe',
            "dist/XAU_AI_PRO_Setup_$version.exe"
          )
          foreach ($artifact in $artifacts) {
            if (!(Test-Path $artifact)) { throw "Artefato ausente: $artifact" }
            Get-FileHash $artifact -Algorithm SHA256 | Format-List
          }

      - name: Publicar artefato (todas as execucoes)
        uses: actions/upload-artifact@v4
        with:
          name: XAU_AI_PRO_Setup
          path: dist/XAU_AI_PRO_Setup_*.exe
          retention-days: 30

      - name: Anexar ao release (somente tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "XAU AI PRO $tag" --generate-notes
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = "dist/XAU_AI_PRO_Setup_$version.exe"
          if (!(Test-Path $setup)) { throw "Instalador nao encontrado: $setup" }
          gh release upload $tag $setup --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release' }
          Write-Host "Setup anexado ao release $tag"