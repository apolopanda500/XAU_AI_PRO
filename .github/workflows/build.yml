# CI principal do XAU_AI_PRO.
#
# Jobs:
#   - test:       lint critico (flake8 E9,F63,F7,F82) + pytest (Ubuntu, xvfb)
#   - docker:     push ao Docker Hub (condicional: vars.DOCKER_ENABLED/DOCKER_USER + secret DOCKER_PAT)
#   - vercel-vcr: push ao Vercel Container Registry (condicional: vars.VCR_ENABLED + secret VERCEL_TOKEN)
#
# Consolidacao: os steps de teste eram do extinto python-app.yml (deduplicacao).

name: ci

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes + lint critico (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r requirements-ci.txt

      - name: Lint com flake8 (erros criticos)
        run: |
          # Falha o build apenas com erros de sintaxe/nomes indefinidos
          flake8 app Python tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avisos de estilo: apenas relatorio, nao bloqueia
          flake8 app Python tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Testes com pytest
        run: |
          xvfb-run -a python -m pytest -q tests
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Docker push a Docker Hub.
  # Desativado atÃ© que se configuren:
  #   - variables: DOCKER_ENABLED='true', DOCKER_USER
  #   - secret:    DOCKER_PAT
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  docker:
    runs-on: ubuntu-latest
    if: vars.DOCKER_ENABLED == 'true' && vars.DOCKER_USER != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar DOCKER_PAT
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          if [ -z "$DOCKER_PAT" ]; then
            echo "::warning::DOCKER_PAT nÃ£o configurado. Pule o push a Docker Hub."
            echo "SKIP_DOCKER=true" >> "$GITHUB_ENV"
          fi

      - name: Login no Docker Hub
        if: env.SKIP_DOCKER != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Configurar Docker Buildx
        if: env.SKIP_DOCKER != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build e push (Docker Hub)
        if: env.SKIP_DOCKER != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: "${{ vars.DOCKER_USER }}/xau-ai-pro-backend:latest"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # Build/push de imagen en Vercel Container Registry (VCR).
  # Requiere: vars.VCR_ENABLED='true' + secret VERCEL_TOKEN.
  # Cada comando `vercel vcr` opera sobre um projeto Vercel: no CI nÃ£o hÃ¡
  # `vercel link`, por isso Ã© obrigatÃ³rio passar --scope (team) e --project.
  # Usa os mesmos secrets/fallbacks do deploy.yml.
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  vercel-vcr:
    runs-on: ubuntu-latest
    if: vars.VCR_ENABLED == 'true'
    env:
      VERCEL_SCOPE: ${{ secrets.VERCEL_ORG_ID || 'team_m6XXhz0AuVtzK0zxtv96h03a' }}
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID || 'prj_RApeFNVlnOGYxtYcRDqaSUTIJD1G' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Vercel CLI
        run: npm install -g vercel@59.6.2

      - name: Verificar VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN nÃ£o configurado. Pule el flujo VCR."
            echo "SKIP_VCR=true" >> "$GITHUB_ENV"
          fi

      - name: Autenticar container tool no VCR
        if: env.SKIP_VCR != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel vcr login docker --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"

      - name: Build e push imagem no VCR
        if: env.SKIP_VCR != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel vcr build docker ./backend --push --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
