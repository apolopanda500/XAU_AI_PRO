name: Validacao e Empacotamento - XAU AI PRO

# O job `deploy-vercel` e o `preview-deploy` foram REMOVIDOS em 04/10/2026.
#
# O projeto passou a ser 100% local, com GitHub e GitLab como unicos canais. A
# CLI da Vercel e o Nitro sairam do repositorio, entao nenhum deploy hosted
# existe mais para esses jobs executarem. Eles nao eram fallback: eram o unico
# caminho de deploy, e dependiam de secrets (VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID) que nao devem mais existir no repositorio.
#
# O job `validate-and-package` foi MANTIDO de proposito: e o que roda a suite
# Python e produz o bundle. Apagar este workflow inteiro derrubaria a unica
# validacao de Python do CI principal.

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

concurrency:
  group: cicd-${{ github.ref }}
  # Sempre cancela o run anterior: o deploy mais recente deve vencer (evita
  # runs travados bloqueando a fila de deploys).
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validar e Empacotar
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.package.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Validar sintaxe Python
        run: python -m compileall -q Python app
      - name: Executar testes Python
        run: xvfb-run -a python -m pytest -q tests
      - name: Empacotar bundle
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # Sanitiza a referência (ex.: "4/merge" em PRs) para não gerar
          # barras no nome do arquivo/artefato
          SAFE_REF="${REF_NAME//\//-}"
          PN="XAU_AI_PRO-${SAFE_REF}-$(date +%Y%m%d%H%M%S)"
          echo "Empacotando como: $PN"
          zip -r "dist/${PN}.zip" Python backend app mcp requirements.txt > /dev/null
          echo "name=${PN}" >> "$GITHUB_OUTPUT"
      - name: Upload artefato
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pkg-${{ steps.package.outputs.name }}
          path: dist/*.zip
          retention-days: 30
