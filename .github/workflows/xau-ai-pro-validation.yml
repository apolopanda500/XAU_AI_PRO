name: XAU AI PRO - validação universal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detectar credenciais expostas
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super-Linter
        uses: super-linter/super-linter/slim@v7
        env:
          DEFAULT_BRANCH: develop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências Python
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm ci
      - name: Testes do gateway e adaptadores
        run: python -m pytest -q
      - name: TypeScript e build frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build
      - name: Empacotar gateway
        run: python -m PyInstaller --clean --noconfirm mt5-gateway.spec
      - name: Verificar artefato do gateway
        shell: pwsh
        run: if (!(Test-Path 'dist/mt5-gateway/mt5-gateway.exe')) { throw 'Gateway não foi gerado' }
