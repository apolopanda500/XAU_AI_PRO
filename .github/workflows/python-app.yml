# Testes e lint do aplicativo Python (desktop tk + pipeline de ML).
# Reutiliza a receita comprovada do maintenance.yml:
#   - Python 3.11 (versão exigida pelo projeto, ver pyproject.toml)
#   - requirements-ci.txt (deps mínimas dos testes — o requirements.txt
#     completo inclui MetaTrader5, que só existe para Windows)
#   - xvfb-run para os testes que criam widgets tkinter
# O flake8 roda em modo estrito apenas para erros reais (E9, F63, F7, F82):
# estilo fica a cargo do pylint.yml.

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes + flake8 (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r requirements-ci.txt

      - name: Lint com flake8 (erros críticos)
        run: |
          # Falha o build apenas com erros de sintaxe/nomes indefinidos
          flake8 app Python tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avisos de estilo: apenas relatório, não bloqueia
          flake8 app Python tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Testes com pytest
        run: |
          xvfb-run -a python -m pytest -q tests
