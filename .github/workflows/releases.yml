# Releases — XAU AI PRO
#
#  * Mensal (1º dia, 08:00 UTC): cria um RELEASE DRAFT com o CHANGELOG.md como
#    notas — pronto para revisão/publicação manual.
#  * O health check diário da API vive no maintenance.yml (10:17 UTC), que
#    também roda testes/lint/audit — centralizado para não duplicar jobs.
#
# Secrets/variaveis:
#   vars.API_URL        -> URL da API em produção (ex.: https://xau-ai-pro-api-apolopanda500.vercel.app)
#   GITHUB_TOKEN        -> disponibilizado automaticamente pelo GitHub Actions
name: Releases (draft mensal)

"on":
  schedule:
    # Mensal: 1º dia do mês 08:00 UTC / 05:00 BRT
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write   # criar releases (mensal)

jobs:
  monthly-release-draft:
    name: Draft de release mensal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      
      - name: Configurar Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
      
      - name: Montar release draft a partir do CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +'%Y.%m')-draft"
          NOTES_HEADER="## Release mensal — $(date -u +'%B %Y')

          Gerada automaticamente em $(date -u +'%Y-%m-%d %H:%M UTC')
          "
          if [ -f CHANGELOG.md ]; then
            NOTES="${NOTES_HEADER}

          ### Destaques (CHANGELOG.md)
          $(head -c 4000 CHANGELOG.md)"
          else
            NOTES="$NOTES_HEADER"
          fi
          # Se o draft já existir, apenas reutiliza (não duplica)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Draft $TAG já existe — atualizando notas"
            gh release edit "$TAG" --notes "$NOTES" || true
          else
            gh release create "$TAG" --draft --title "Release mensal $(date -u +'%B %Y')" --notes "$NOTES"
          fi
