name: ci

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Configurar Docker Buildx Cloud
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "rickjax123/apolopanda500"

      - name: Build e push (Docker Hub)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: "${{ vars.DOCKER_USER }}/xau-ai-pro-backend:latest"

  vercel-vcr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Vercel CLI
        run: npm install -g vercel@59.6.2

      - name: Autenticar container tool no VCR
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel vcr login docker --token "$VERCEL_TOKEN" --yes

      - name: Build e push imagem no VCR
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel vcr build docker ./backend --push --token "$VERCEL_TOKEN" --yes