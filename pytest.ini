[pytest]
testpaths = tests
norecursedirs = .git .venv experiments frontend/src-tauri/bridge frontend/src-tauri/gen frontend/src-tauri/target dist build
# `--basetemp` fixado DENTRO do repositorio (corrigido em 03/10/2026).
#
# Sem isto o pytest usa o padrao da plataforma: `%LOCALAPPDATA%\Temp\pytest-of-<usuario>`
# no Windows e `/tmp/pytest-of-<usuario>` no Linux. Nesta maquina a pasta
# `C:\Users\Micro\AppData\Local\Temp\pytest-of-Micro` tem ACL CORROMPIDA - nem o
# proprio dono consegue le-la, e `Get-Acl` responde "Tentativa de execucao de
# uma operacao nao autorizada". O sintoma NAO e teste quebrado: e
# `PermissionError: [WinError 5]` na COLETA, e a suite inteira reportava
# 199 `ERROR` que somem assim que o pytest para de precisar daquela pasta.
#
# Medido em 03/10/2026, mesmo commit, mesmas tres formas:
#   sem `--basetemp`  ->  606 passed, 25 skipped, 199 errors (192 s)
#   com `--basetemp`  ->  833 passed,  0 skipped,   0 errors (111 s)
#
# `scripts\limpeza_segura.ps1` (funcao `Resolve-Icacls`, secao "LIMITACAO HONESTA")
# ja registra que essa ACL so reverte com shell elevado. Nao ha o que corrigir no
# codigo: o alvo e um cache temporario do pytest, e a solucao e nao depender dele.
#
# O PATH: `.pytest-tmp-basetemp`, na RAIZ do repositorio. Isto nao e detalhe
# estetico: o caminho anterior (`Temp/pytest-basetemp`) REPROVOU no CI Linux,
#
#   FileNotFoundError: /home/runner/work/.../Temp/pytest-basetemp
#   1 failed, 596 passed, 40 skipped, 196 errors
#
# O pytest NAO cria o diretorio do `--basetemp` (medido nesta maquina com um
# caminho inexistente: os testes passam e a pasta continua sem existir). E
# `Temp/` esta no `.gitignore` (linha 42), entao num checkout limpo ela nunca
# existe. A raiz do repositorio existe sempre, e `.pytest-tmp-*/` ja e
# ignorado pela linha 186 - o padrao casa com este nome.
#
# `.pytest_cache/` NAO serve: tem a mesma ACL corrompida (o script
# `limpeza_segura.ps1:152` avisa disso).
#
# FICA EM `addopts`, E NAO COMO CHAVE SOLTA: verificado neste pytest (9.1.1),
# `basetemp = ...` na secao `[pytest]` e ACEITO SEM ERRO E IGNORADO - o ini
# continua aparecendo como `configfile: pytest.ini`, a pasta do `%TEMP%` segue
# sendo usada e o pytest emite `PytestConfigWarning: Unknown config option:
# basetemp`. So a flag de linha de comando funciona, entao e aqui que ela vai.
addopts = -ra --basetemp=.pytest-tmp-basetemp
