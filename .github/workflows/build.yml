name: ci

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Docker push a Docker Hub.
  # Desativado até que se configuren:
  #   - variables: DOCKER_ENABLED='true', DOCKER_USER
  #   - secret:    DOCKER_PAT
  # ────────────────────────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    if: vars.DOCKER_ENABLED == 'true' && vars.DOCKER_USER != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar DOCKER_PAT
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          if [ -z "$DOCKER_PAT" ]; then
            echo "::warning::DOCKER_PAT não configurado. Pule o push a Docker Hub."
            echo "SKIP_DOCKER=true" >> "$GITHUB_ENV"
          fi

      - name: Login no Docker Hub
        if: env.SKIP_DOCKER != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Configurar Docker Buildx Cloud
        if: env.SKIP_DOCKER != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "rickjax123/apolopanda500"

      - name: Build e push (Docker Hub)
        if: env.SKIP_DOCKER != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: "${{ vars.DOCKER_USER }}/xau-ai-pro-backend:latest"

  # ────────────────────────────────────────────────────────────────────────
  # Build/push de imagen en Vercel Container Registry (VCR).
  # Desativado hasta que se configure `secrets.VERCEL_TOKEN`.
  # Se corrigió el uso de `--yes` (opción no soportada por `vercel vcr`).
  # El guard del job no puede usar `secrets`, por eso se valida en un step.
  # ────────────────────────────────────────────────────────────────────────
  vercel-vcr:
    runs-on: ubuntu-latest
    if: vars.VCR_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Vercel CLI
        run: npm install -g vercel@59.6.2

      - name: Verificar VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN não configurado. Pule el flujo VCR."
            echo "SKIP_VCR=true" >> "$GITHUB_ENV"
          fi

      - name: Autenticar container tool no VCR
        if: env.SKIP_VCR != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel vcr login docker --token "$VERCEL_TOKEN"

      - name: Build e push imagem no VCR
        if: env.SKIP_VCR != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel vcr build docker ./backend --push --token "$VERCEL_TOKEN"