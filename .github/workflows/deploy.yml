name: CI/CD - XAU AI PRO (GitHub + Vercel + Sentry)

on:
  push:
    branches: [ main, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  SENTRY_ORG: henrique-7n
  SENTRY_PROJECT: default
  # ⚠️ Domínio real do projeto Vercel (com sufixo da team). O domínio
  # "xau-ai-pro-api.vercel.app" NÃO existe (sem o sufixo da team).
  API_URL: https://xau-ai-pro-api-apolopanda500.vercel.app

concurrency:
  group: cicd-${{ github.ref }}
  # Sempre cancela o run anterior: o deploy mais recente deve vencer (evita
  # runs travados bloqueando a fila de deploys).
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validar e Empacotar
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.package.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Validar sintaxe Python
        run: python -m compileall -q Python app
      - name: Executar testes Python
        run: xvfb-run -a python -m pytest -q tests
      - name: Empacotar bundle
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # Sanitiza a referência (ex.: "4/merge" em PRs) para não gerar
          # barras no nome do arquivo/artefato
          SAFE_REF="${REF_NAME//\//-}"
          PN="XAU_AI_PRO-${SAFE_REF}-$(date +%Y%m%d%H%M%S)"
          echo "Empacotando como: $PN"
          zip -r "dist/${PN}.zip" Python backend app mcp requirements.txt > /dev/null
          echo "name=${PN}" >> "$GITHUB_OUTPUT"
      - name: Upload artefato
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pkg-${{ steps.package.outputs.name }}
          path: dist/*.zip
          retention-days: 30

  build-frontend:
    name: Build Frontend + Sentry
    needs: validate-and-package
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enviar source maps ao Sentry (sentry-cli)
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ env.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ env.SENTRY_PROJECT }}
        run: |
          npm install -g @sentry/cli
          sentry-cli releases new "${{ github.sha }}-$GITHUB_RUN_NUMBER" || true
          sentry-cli releases set-commits "${{ github.sha }}-$GITHUB_RUN_NUMBER" --auto || true
          if [ -d frontend/dist ]; then
            sentry-cli releases files "${{ github.sha }}-$GITHUB_RUN_NUMBER" upload-sourcemaps ./frontend/dist/ --url-prefix '~/dist' || true
          elif [ -d frontend/build ]; then
            sentry-cli releases files "${{ github.sha }}-$GITHUB_RUN_NUMBER" upload-sourcemaps ./frontend/build/ --url-prefix '~/build' || true
          else
            echo 'Sem frontend/dist ou frontend/build - skip source maps'
          fi
          sentry-cli releases finalize "${{ github.sha }}-$GITHUB_RUN_NUMBER" || true

  deploy-vercel:
    name: Deploy Vercel
    needs: validate-and-package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_m6XXhz0AuVtzK0zxtv96h03a' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_RApeFNVlnOGYxtYcRDqaSUTIJD1G' }}
      # Webhook do Slack definido no nível do JOB para ser visível nas condições "if"
      # (aceita SLACK_WEBHOOK ou SLACK_WEBHOOK_URL)
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK || secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Guard - Verificar token Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN ausente. Crie em https://vercel.com/account/tokens e adicione nos Secrets do repo."
            exit 1
          fi
          echo "Token OK | Org=$VERCEL_ORG_ID | Proj=$VERCEL_PROJECT_ID"
      - name: Notificar Slack (início do deploy)
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": ":rocket: Deploy XAU AI PRO iniciado",
              "blocks": [
                {"type":"section","text":{"type":"mrkdwn","text":":rocket: *Deploy XAU AI PRO iniciado*"}},
                {"type":"section","text":{"type":"mrkdwn","text":"*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Run:* #${{ github.run_number }}\n*Link:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}
              ]
            }
          webhook-type: incoming-webhook
      - name: Instalar dependências backend
        run: |
          cd backend
          npm install --no-audit --no-fund
      - name: Deploy produção (Vercel CLI oficial)
        # ✅ Executa DENTRO de backend/ (o projeto xau-ai-pro-api NÃO tem Root
        # Directory configurado, então não gera "backend/backend"). Isso garante
        # que o build Nitro (nitro build) rode de verdade — o deploy da raiz
        # gerava um build estático vazio.
        # Obs 2: o CLI do `--prod` pode ficar pendurado aguardando o check
        # "deployment-alias" (pending). Usamos `timeout` + grep para extrair a
        # URL e depois aguardamos READY via API antes de promover.
        working-directory: backend
        run: |
          set -o pipefail
          # 1) Cria o deployment (limite de tempo para não prender o job)
          timeout 180 npx vercel@59.9.1 --prod --force --yes --token "$VERCEL_TOKEN" 2>&1 | tee deploy-output.log || true
          URL=$(grep -oiE 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-output.log | tail -n 1 || true)
          if [ -z "$URL" ]; then
            echo "::error::URL de deploy não encontrada no log do Vercel"
            exit 1
          fi
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
          echo "Deployment URL: $URL"
          # 2) Aguardar o deployment atingir READY (poll via API REST — mais
          # confiável que o `vercel inspect`, cuja saída formata o estado como
          # "● Ready" e não é capturado por grep de palavras).
          # O endpoint v13 aceita a URL do deployment diretamente.
                    # Estrategia: vercel inspect --json (primitivo mas confiavel); fallback API v13
          READY=0
          for i in $(seq 1 30); do
            STATE=$(npx vercel@59.9.1 inspect "$URL" --json --token "$VERCEL_TOKEN" 2>/dev/null | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('readyState',''))" 2>/dev/null || true)
            if [ -z "$STATE" ]; then
              STATE=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/${URL}?teamId=${VERCEL_ORG_ID}" 2>/dev/null | \
                python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('readyState',''))" 2>/dev/null || true)
            fi
            echo "[$i] readyState: ${STATE:-aguardando...}"
            if [ "$STATE" = "READY" ]; then echo "Deployment READY"; READY=1; break; fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then echo "::error::Deployment $STATE"; exit 1; fi
            sleep 10
          done
          if [ "$READY" != "1" ]; then echo "::warning::Timeout aguardando READY - proseguindo para promote"; fi

          # 3) Promove explicitamente (contorna o check deployment-alias que fica
          #    pending no auto-assign de projetos sem microfrontends)
          npx vercel@59.9.1 promote "$URL" --yes --token "$VERCEL_TOKEN" || \
            echo "::warning::Promoção automática falhou - promote manual no dashboard"
      - name: Smoke test pós-deploy
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "$API_URL/api/health" | grep -q '"ok":true'; then
              echo "Healthcheck OK"; exit 0
            fi
            sleep 10
          done
          echo "::warning::Healthcheck ainda não refletiu o novo deploy"
      - name: Coletar URL do deploy p/ notificação
        id: notify
        run: |
          DEPLOY_URL="${DEPLOY_URL:-$API_URL}"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "run=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Notificar Slack (sucesso)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": ":white_check_mark: Deploy XAU AI PRO OK",
              "blocks": [
                {"type":"section","text":{"type":"mrkdwn","text":":white_check_mark: *Deploy XAU AI PRO OK*"}},
                {"type":"section","text":{"type":"mrkdwn","text":"*Projeto:* xau-ai-pro-api\n*Branch:* `${{ steps.notify.outputs.ref }}`\n*Commit:* `${{ steps.notify.outputs.commit }}`\n*Run:* #${{ steps.notify.outputs.run }}\n*Deploy:* ${{ steps.notify.outputs.deploy_url }}"}}
              ]
            }
          webhook-type: incoming-webhook
      - name: Notificar Slack (falha)
        # Tolerante a ausência do secret: não falha quando SLACK_WEBHOOK não existe
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": ":x: Falha no deploy XAU AI PRO",
              "blocks": [
                {"type":"section","text":{"type":"mrkdwn","text":":x: *Falha no deploy XAU AI PRO*"}},
                {"type":"section","text":{"type":"mrkdwn","text":"*Branch:* `${{ github.ref_name }}`\n*Run:* #${{ github.run_number }}\n*Veja:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}
              ]
            }
          webhook-type: incoming-webhook

  preview-deploy:
    name: Preview Deploy (PR / develop)
    needs: validate-and-package
    runs-on: ubuntu-latest
    # Roda em PRs para main E em pushes para develop (preview/staging do backend).
    # Em pushes a develop o Vercel CLI gera um deployment de preview com URL
    # unica (--yes aceita os prompts padrao), sem tocar em producao.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_m6XXhz0AuVtzK0zxtv96h03a' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_RApeFNVlnOGYxtYcRDqaSUTIJD1G' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Guard token
        run: test -n "$VERCEL_TOKEN" || { echo "::error::Configure o secret VERCEL_TOKEN"; exit 1; }
      - name: Instalar dependências backend
        run: |
          cd backend
          npm install --no-audit --no-fund
      - name: Preview (Vercel CLI)
        # Executa dentro de backend/ para o build Nitro correto (mesma razão
        # do deploy de produção acima)
        working-directory: backend
        run: npx vercel@59.9.1 --yes --token "$VERCEL_TOKEN"

  notify-slack-failure:
    name: Notificar Slack (falha no deploy Vercel)
    # Executa mesmo se o deploy falhar: usa always() + failure() dos needs.
    # jobs deploy-vercel/healthcheck tem `if: success()`, então seriam pulados
    # na falha e a notificação nunca chegaria — por isso o job dedicado.
    needs: [build-frontend, deploy-vercel]
    runs-on: ubuntu-latest
    if: always() && (needs.build-frontend.result == 'failure' || needs.deploy-vercel.result == 'failure')
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK || secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Enviar alerta de falha ao Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": ":x: Falha no deploy XAU AI PRO",
              "blocks": [
                {"type":"section","text":{"type":"mrkdwn","text":":x: *Falha no deploy XAU AI PRO*"}},
                {"type":"section","text":{"type":"mrkdwn","text":"*Branch:* `${{ github.ref_name }}` | *Run:* #${{ github.run_number }}\n*Build Frontend:* ${{ needs.build-frontend.result }}\n*Deploy Vercel:* ${{ needs.deploy-vercel.result }}\n*Logs:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}
              ]
            }
          webhook-type: incoming-webhook
      - name: Avisar ausência do webhook
        if: env.SLACK_WEBHOOK_URL == ''
        run: |
          echo "::warning::SLACK_WEBHOOK_URL não configurado - notificação de falha não enviada"
          echo "Build Frontend: ${{ needs.build-frontend.result }}"
          echo "Deploy Vercel: ${{ needs.deploy-vercel.result }}"
          echo "Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  healthcheck:
    name: Health Check Final
    needs: deploy-vercel
    runs-on: ubuntu-latest
    if: success()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK || secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Aguardar propagação do alias
        run: sleep 15
      - name: Verificar saúde da API
        run: |
          curl -fsSL "$API_URL/api/health" | head -c 500
          echo ""
          curl -fsSL "$API_URL/" | head -c 300
      - name: Notificar Slack (conclusão)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          DEPLOY_API_URL: ${{ env.API_URL }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {
              "text": ":tada: Pipeline XAU AI PRO concluido com sucesso",
              "blocks": [
                {"type":"section","text":{"type":"mrkdwn","text":":tada: *Pipeline XAU AI PRO concluído com sucesso*"}},
                {"type":"section","text":{"type":"mrkdwn","text":"*Branch:* `${{ github.ref_name }}` | *Run:* #${{ github.run_number }}\n*Health:* ${{ env.DEPLOY_API_URL }}/api/health\n*Workflows:* marketDataWorkflow, reconcileWorkflow"}}
              ]
            }
          webhook-type: incoming-webhook
