name: Validate & Package Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11 (cache pip)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CI)
        run: |
          python -m pip install --upgrade pip
          # MetaTrader5 e exclusivo Windows (sem wheel Linux) -> filtrado no CI.
          # No desktop Windows use o requirements.txt completo normalmente.
          grep -viE '^\s*MetaTrader5' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Validate Python modules (syntax check)
        run: |
          python -m compileall -q \
            MQL5/Experts/XAU_AI_PRO/Release/v1.2.0/Python \
            Backend App || true
          echo "Syntax validation done"

      - name: Package release bundle
        run: |
          mkdir -p dist
          zip -r "dist/XAU_AI_PRO-${{ github.ref_name }}.zip" \
            "MQL5/Experts/XAU_AI_PRO/Release/v1.2.0" \
            Python \
            Backend \
            App \
            requirements.txt \
            > /dev/null
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: XAU_AI_PRO-package
          path: dist/*.zip
          retention-days: 30
