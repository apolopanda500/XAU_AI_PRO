# Triage de pull requests: aplica labels conforme os caminhos alterados.
# Configuracao em .github/labeler.yml (formato v5: changed-files/globs).
# A v4 nao entende esse formato — o upgrade para v5 alinha action e config.
# permissions no top-level e exigencia do labeler v5.

name: Labeler
on: [pull_request_target]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

