[package]
name = "xau-ai-pro-desktop"
version = "1.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "1.5.4", features = [ "process-command-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

