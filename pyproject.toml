[tool.poetry]
name = "xau_ai_pro"
version = "1.2.0"
description = "XAU AI PRO — trading assistant for MetaTrader 5 with AI integration and management dashboard."
authors = ["apolopanda500"]
readme = "README.md"
packages = [{ include = "xau_ai_pro", from = "src" }]

[project]
name = "xau_ai_pro"
version = "1.2.0"
description = "XAU AI PRO - trading assistant for MetaTrader 5 with AI integration and management dashboard."
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai>=1.0,<2.0",
    "python-dotenv>=1.0",
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
crewai = ">=1.0,<2.0"
python-dotenv = ">=1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[tool.crewai]
type = "crew"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"