# Deploy del sitio estático de XAU AI PRO a GitHub Pages.
#
# Se publica el contenido de `frontend/public/` en cada push a `main`,
# sin necesidad de construir con Node (build no requerido).

name: Deploy site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/public/**"
      - ".github/workflows/nuxtjs.yml"
  workflow_dispatch:

# Permisos del GITHUB_TOKEN permiten publicar en GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Solo una implementación concurrente; no se cancelan las en curso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5