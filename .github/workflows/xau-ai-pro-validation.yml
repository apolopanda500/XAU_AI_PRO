name: XAU AI PRO - validação universal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detectar credenciais expostas
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  quality:
    # O Super-Linter foi substituido pelas ferramentas DO PROJETO (20/10/2026).
    #
    # MEDIDO em 7 dias seguidos: o job reprovava em TODO push com 228 erros do
    # ESLint ("Can't resolve 'vitest/config'") porque o Super-Linter roda sem
    # `node_modules`; os flags `*_PRETTIER: false` nao existem no v8 (o nome
    # correto e `VALIDATE_*`), entao Prettier e Biome continuavam rodando; e o
    # summary de 6 MB estourava o limite de 1 MB do GitHub, derrubando o job
    # mesmo quando nada no codigo estava errado.
    #
    # O repositorio ja tem as ferramentas certas, com a configuracao dele:
    # `npm run lint` (ESLint com backend/eslint.config.mjs) no backend,
    # `npx tsc --noEmit` e `npm test` (vitest) no frontend. E isso que roda.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint do backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
      - name: Typecheck e testes do frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test

  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências Python
        # `-ci` e nao `requirements.txt`: o arquivo de producao traz
        # MetaTrader5 e streamlit, que nao instalam em runner Linux e so
        # aumentam o tempo sem participarem de nenhum teste.
        #
        # `-ci` NAO era instalado antes, e era a causa do workflow falhar:
        # `tests/test_fastapi_auth.py` e `tests/test_fastapi_capabilities.py`
        # importam `backend.fastapi_gateway`, que precisa de `fastapi`. Sem
        # ele os dois modulos morrem na COLETA e o pytest sai com
        # "Interrupted: 2 errors during collection" — nenhum teste roda.
        #
        # `-build` entra de volta porque a etapa "Empacotar gateway" roda
        # `python -m PyInstaller`, e o PyInstaller so esta em
        # `requirements-build.txt`. Sem ele o empacotamento morre com
        # "No module named PyInstaller" — que foi a falha seguinte.
        # Foi trocado por `-ci` e custou exatamente isto.
        run: python -m pip install -r requirements-ci.txt -r requirements-build.txt -r requirements-dev.txt
      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm ci
      - name: Testes do gateway e adaptadores
        run: python -m pytest -q
      - name: TypeScript e build frontend
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build
      # Os `.pkl` e `.meta.json` sao artefatos de TREINO e nao vao no git
      # (`.gitignore:49`). Num checkout limpo a pasta
      # `frontend/src-tauri/Python/models` nao existe, e o PyInstaller aborta:
      #   ERROR: Unable to find '...frontend\src-tauri\Python\models'
      #          when adding binary and data files.
      #
      # A pasta e criada aqui para o empacotamento PROSSEGUIR e o CI validar o
      # que da para validar no runner: que o `.spec` compila e que o gateway e
      # gerado. O bundle deste runner sai SEM os modelos - que e o estado real
      # de qualquer maquina que nao treinou - e nao finge o contrario. O
      # instalador que o dono usa sai de `scripts/build_app.bat`, na maquina de
      # operacao, onde os 3 modelos MULTI estao presentes.
      - name: Preparar pasta de modelos
        shell: pwsh
        run: |
          $destino = 'frontend/src-tauri/Python/models'
          if (!(Test-Path $destino)) {
            New-Item -ItemType Directory -Path $destino -Force | Out-Null
            Write-Host "[AVISO] $destino nao existe: artefatos de treino nao vao no git."
            Write-Host "[AVISO] O bundle deste runner sai SEM os modelos; o .spec compila e o gateway e gerado."
          }
      - name: Empacotar gateway
        run: python -m PyInstaller --noconfirm mt5-gateway.spec
      # Existe so para "o exe foi gerado". Um `.spec` com entry point trocado
      # (`fastapi_gateway` em vez de `mt5_gateway`) ou sem `Docs/version.json`
      # também gera um exe — e é o binário que o operador executa. A medição
      # sobe o `.exe` em porta efemera e reprova se ele aceitar chamada sem
      # token, aceitar token errado, liberar saque/transferência ou executar
      # ordem `execute=false`. O runner não tem MT5 nem os `.pkl` de treino;
      # ambos são opcionais no boot e o gateway continua no modo universal.
      - name: Verificar artefato do gateway
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/mt5-gateway/mt5-gateway.exe')) { throw 'Gateway não foi gerado' }
          python scripts/medir_artefato_gateway.py
          if ($LASTEXITCODE -ne 0) { throw "Medição do artefato reprovou (exit $LASTEXITCODE)" }
