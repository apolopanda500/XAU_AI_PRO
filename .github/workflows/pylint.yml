name: Pylint

# Análise estática do código Python (app desktop + pipeline + testes).
# Configuração em .pylintrc. Job único no Python 3.11 (versão exigida pelo
# projeto, conforme pyproject.toml). --exit-zero: relatório de qualidade
# não bloqueia o deploy (gates de segurança ficam no security.yml).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pylint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pylint:
    name: Análise estática (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Análise com pylint (score no log)
        run: |
          pylint --rcfile=.pylintrc $(git ls-files '*.py') --exit-zero
