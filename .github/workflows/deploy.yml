name: CI/CD - XAU AI PRO (GitHub + Vercel + Sentry)

on:
  push:
    branches: [ main, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  SENTRY_ORG: henrique-7n
  SENTRY_PROJECT: default
  API_URL: https://xau-ai-pro-api.vercel.app

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    name: Validar e Empacotar
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.package.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          grep -viE "^\s*MetaTrader5" requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt
      - name: Validar sintaxe Python
        run: python -m compileall -q MQL5/Experts/XAU_AI_PRO/Release/v1.2.0/Python backend app || true
      - name: Empacotar bundle
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # Sanitiza a referência (ex.: "4/merge" em PRs) para não gerar
          # barras no nome do arquivo/artefato
          SAFE_REF="${REF_NAME//\//-}"
          PN="XAU_AI_PRO-${SAFE_REF}-$(date +%Y%m%d%H%M%S)"
          echo "Empacotando como: $PN"
          zip -r "dist/${PN}.zip" MQL5/Experts/XAU_AI_PRO/Release/v1.2.0 Python backend app requirements.txt > /dev/null
          echo "name=${PN}" >> "$GITHUB_OUTPUT"
      - name: Upload artefato
        uses: actions/upload-artifact@v5
        with:
          name: pkg-${{ steps.package.outputs.name }}
          path: dist/*.zip
          retention-days: 30

  build-frontend:
    name: Build Frontend + Sentry
    needs: validate-and-package
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar dependências frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm install
          else
            echo 'Sem frontend/package.json - skip'
          fi
      - name: Enviar source maps ao Sentry (sentry-cli)
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm install -g @sentry/cli
          if [ -d frontend/build ]; then
            sentry-cli releases new "${{ github.sha }}-$GITHUB_RUN_NUMBER" || true
            sentry-cli releases set-commits "${{ github.sha }}-$GITHUB_RUN_NUMBER" --auto || true
            sentry-cli releases files "${{ github.sha }}-$GITHUB_RUN_NUMBER" upload-sourcemaps ./frontend/build --url-prefix '~/build' || true
            sentry-cli releases finalize "${{ github.sha }}-$GITHUB_RUN_NUMBER" || true
          else
            echo 'Sem pasta frontend/build - skip Sentry source maps'
          fi

  deploy-vercel:
    name: Deploy Vercel
    needs: validate-and-package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_m6XXhz0AuVtzK0zxtv96h03a' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_RApeFNVlnOGYxtYcRDqaSUTIJD1G' }}
      # Webhook do Slack definido no nível do JOB para ser visível nas condições "if"
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Guard - Verificar token Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN ausente. Crie em https://vercel.com/account/tokens e adicione nos Secrets do repo."
            exit 1
          fi
          echo "Token OK | Org=$VERCEL_ORG_ID | Proj=$VERCEL_PROJECT_ID"
      - name: Instalar dependências backend
        run: |
          cd backend
          npm install --no-audit --no-fund
      - name: Deploy produção (Vercel CLI oficial)
        # ⚠️ Executa NA RAIZ do repo. O Root Directory "backend" configurado nas
        # settings do projeto na Vercel é resolvido pelo próprio CLI a partir do cwd.
        # NÃO adicionar working-directory/cd aqui, senão gera "backend/backend".
        run: |
          set -o pipefail
          npx vercel@59.6.2 --prod --force --yes --token "$VERCEL_TOKEN" | tee deploy-output.log
          URL=$(grep -oiE 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy-output.log | tail -n 1 || true)
          if [ -z "$URL" ]; then
            echo "::warning::URL de deploy não encontrada no log do Vercel"
          fi
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
      - name: Smoke test pós-deploy
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "$API_URL/api/health" | grep -q '"ok":true'; then
              echo "Healthcheck OK"; exit 0
            fi
            sleep 10
          done
          echo "::warning::Healthcheck ainda não refletiu o novo deploy"
      - name: Notificar Slack (sucesso)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {"text":"Deploy XAU AI PRO OK!","blocks":[{"type":"section","text":{"type":"mrkdwn","text":"*OK* Branch: `${{ github.ref_name }}` | Run: #${{ github.run_number }} | ${{ env.API_URL }}"}}]}
      - name: Notificar Slack (falha)
        # Tolerante a ausência do secret: não falha quando SLACK_WEBHOOK não existe
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload: |
            {"text":"Falha no deploy XAU AI PRO","blocks":[{"type":"section","text":{"type":"mrkdwn","text":"*FALHA* Branch: `${{ github.ref_name }}` | Run: #${{ github.run_number }}"}}]}

  preview-deploy:
    name: Preview Deploy (PR)
    needs: validate-and-package
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_m6XXhz0AuVtzK0zxtv96h03a' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_RApeFNVlnOGYxtYcRDqaSUTIJD1G' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Guard token
        run: test -n "$VERCEL_TOKEN" || { echo "::error::Configure o secret VERCEL_TOKEN"; exit 1; }
      - name: Instalar dependências backend
        run: |
          cd backend
          npm install --no-audit --no-fund
      - name: Preview (Vercel CLI)
        # Também roda da raiz para respeitar o Root Directory das settings
        run: npx vercel@59.6.2 --yes --token "$VERCEL_TOKEN"

  healthcheck:
    name: Health Check Final
    needs: deploy-vercel
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Aguardar propagação do alias
        run: sleep 15
      - name: Verificar saúde da API
        run: |
          curl -fsSL "$API_URL/api/health" | head -c 500
          echo ""
          curl -fsSL "$API_URL/" | head -c 300
