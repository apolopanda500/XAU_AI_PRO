name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  segredos:
    # Roda em todo push para main/develop e em todo pull_request: e a primeira
    # barreira do repositorio. Sem ela, um `.env` com chave so apareceria no
    # alerta de seguranca, depois de ja estar publicado.
    name: Segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo (historico)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Varredura de segredos (historico completo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  rust:
    needs: segredos
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
  frontend:
    needs: segredos
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
